<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="pearlescentBackground"></div>
    <div id="startScreen">
        <h1 id="startScreenTitle">Geography Quiz</h1>
        <button id="startButton">Press any key to start</button>
    </div>
    <div id="quizContainer" style="display: none;">
        <div>
            <h2 id="scoreFullText">Score: <strong id="score">0</strong></h2>
            <h2 id="currentLandmark">Landmark 1 of 10</h2>
            <!-- <button id="newLandmark">New Landmark</button> -->
        </div>
        <h1>Geography Quiz</h1>
        <p>Identify the continent, country, and city of famous landmarks!</p>
        <div id="side-by-side">
            <div class="image-container">
                <img id="locationImg" src="./photos/london.jpeg" alt="random location to guess" width="500"
                    height="500">
            </div>
            <div id="answer-container">
                <h2 id="level">Level 1: Continent</h2>
                <h3 id="prompt" class="overlay-text">Which continent is this landmark located in?</h3>
                <br>
                <button id="option1" class="multipleChoiceOption" data-answer="">A. Europe</button>
                <button id="option2" class="multipleChoiceOption" data-answer="">B. Africa</button>
                <button id="option3" class="multipleChoiceOption" data-answer="">C. Asia</button>
                <button id="option4" class="multipleChoiceOption" data-answer="">D. North America</button>
            </div>
        </div>
        <div id="feedback-container">
            <h2 id="feedback-h2">Correct or incorrect who knows</h2>
        </div>
    </div>
    <div id="gameOver">
        <h1>Game Over!</h1>
        <h2 id="game-over-score">You scored: </h2>
    </div>
    <div style="position:absolute; width:1px; height:1px; overflow:hidden;">
        <svg xmlns="http://www.w3.org/2000/svg" width="1" height="1">
            <filter id="pearlescent" x="-50%" y="-50%" width="200%" height="200%" filterUnits="objectBoundingBox">
                <feTurbulence type="turbulence" baseFrequency="0.012" numOctaves="5" seed="7" result="noise" />
                <feTile in="noise" result="tiledNoise" />
                <feDisplacementMap in="SourceGraphic" in2="tiledNoise" scale="25" xChannelSelector="R"
                    yChannelSelector="G" />
            </filter>
        </svg>
    </div>
</body>

</html>
